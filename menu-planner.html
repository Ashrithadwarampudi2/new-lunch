<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Menu Planner | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg custom-navbar py-3 bg-dark">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="admin-new.html">← Back to Admin Dashboard</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm p-4 mb-4">
                    <h2 class="fw-bold text-dark mb-2">Automated Weekly Menu Generator</h2>
                    <p class="text-secondary mb-4">Generate a 5-day balanced menu using active restaurants from your local database.</p>
                   
                    <div id="plannerStatus" class="alert d-none mb-4" role="alert"></div>

                    <button class="btn btn-primary btn-lg w-100" onclick="generateMenu()">Generate Balanced Weekly Schedule</button>
                </div>

                <div id="generatedScheduleContainer" class="d-none">
                    <h4 class="fw-bold text-dark mb-3">Generated Menu Preview</h4>
                    <div class="table-responsive bg-white rounded shadow-sm p-3 mb-4">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Day</th>
                                    <th>Meal Type</th>
                                    <th>Selected Restaurant</th>
                                    <th>Cuisine</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleTableBody"></tbody>
                        </table>
                    </div>
                    <button class="btn btn-success btn-lg w-100" onclick="saveGeneratedMenu()">Approve and Publish Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let generatedSchedule = [];

        // Generate Menu fetching from local Node / Express backend
        async function generateMenu() {
            const statusBox = document.getElementById("plannerStatus");
            statusBox.classList.remove("d-none", "alert-danger");
            statusBox.classList.add("alert-success");
            statusBox.textContent = "Loading restaurants from backend server...";

            try {
                const response = await fetch("/api/restaurants?active=true");
                if (!response.ok) throw new Error("Failed to load restaurants");

                const restaurants = await response.json();

                if (!restaurants || restaurants.length === 0) {
                    throw new Error("No active restaurants found in database.");
                }

                const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
                const selectedRestaurants = new Set();
                const selectedCuisines = new Set();
                generatedSchedule = [];

                // Filter out breakfast-only options for lunch, along with ensuring cuisine/restaurant variety
                function getAvailableRestaurant(serviceFilter = null) {
                    return restaurants.filter(r => {
                        if (r.service_type === "Breakfast") return false; // Exclude breakfast vendors from lunch
                        if (selectedRestaurants.has(r.id)) return false;
                        if (selectedCuisines.has(r.cuisine_type)) return false;
                        if (serviceFilter && r.service_type !== serviceFilter && r.service_type !== "Both") return false;
                        return true;
                    });
                }

                // 1. Generate Monday - Friday Lunch Menu
                days.forEach(day => {
                    let pool = getAvailableRestaurant();

                    if (pool.length === 0) {
                        selectedCuisines.clear();
                        pool = getAvailableRestaurant();
                    }

                    if (pool.length > 0) {
                        const randomIndex = Math.floor(Math.random() * pool.length);
                        const chosen = pool[randomIndex];

                        selectedRestaurants.add(chosen.id);
                        selectedCuisines.add(chosen.cuisine_type);

                        generatedSchedule.push({
                            day_of_week: day,
                            meal_type: "Lunch",
                            meal_id: chosen.id,
                            restaurant_name: chosen.name,
                            cuisine: chosen.cuisine_type
                        });
                    }
                });

                // 2. Add Separate Friday Breakfast/Bagels Entry
                const breakfastOptions = restaurants.filter(r => r.service_type === "Breakfast" || r.service_type === "Both");

                if (breakfastOptions.length > 0) {
                    const breakfastVendor = breakfastOptions[0];

                    generatedSchedule.push({
                        day_of_week: "Friday",
                        meal_type: "Breakfast",
                        meal_id: breakfastVendor.id,
                        restaurant_name: breakfastVendor.name,
                        cuisine: breakfastVendor.cuisine_type
                    });
                }

                renderScheduleTable();
                statusBox.textContent = "Weekly schedule generated successfully!";
                document.getElementById("generatedScheduleContainer").classList.remove("d-none");

            } catch (error) {
                console.error("Restaurant load error:", error);
                statusBox.classList.remove("alert-success");
                statusBox.classList.add("alert-danger");
                statusBox.textContent = error.message || "Could not load restaurants.";
            }
        }

        function renderScheduleTable() {
            const tableBody = document.getElementById("scheduleTableBody");
            tableBody.innerHTML = "";
            generatedSchedule.forEach(item => {
                const row = document.createElement("tr");
                const badgeColor = item.meal_type === "Breakfast" ? "bg-warning text-dark" : "bg-primary";
                row.innerHTML = `
                    <td class="fw-bold">${item.day_of_week}</td>
                    <td><span class="badge ${badgeColor}">${item.meal_type}</span></td>
                    <td class="fw-semibold">${item.restaurant_name}</td>
                    <td><span class="badge bg-secondary">${item.cuisine}</span></td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function saveGeneratedMenu() {
            const statusBox = document.getElementById("plannerStatus");
            try {
                const response = await fetch("/api/weekly-menu", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ schedule: generatedSchedule })
                });

                if (response.ok) {
                    alert("Menu published successfully!");
                    window.location.href = "admin-new.html";
                } else {
                    const err = await response.json();
                    alert(err.error || "Failed to publish menu.");
                }
            } catch (err) {
                console.error("Error publishing menu:", err);
                alert("Network error publishing menu.");
            }
        }
    </script>
</body>
</html>
